name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reciprocity.py sits at the root because both experiment folders import it,
    # and a script's sys.path starts at its own directory rather than at the
    # working directory, so the root has to be put on the path explicitly.
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # original/ is preserved, not maintained. Nothing there is expected to run,
      # and one of its notebooks does not terminate by design of its last cell.
      - name: The mirror-neuron simulation still runs end to end
        run: jupyter execute mirror_neurons/mirror_neurons_rerun.ipynb

      # The notebook step above regenerates the figures beside it and nothing
      # checks them, so they could drift from the code for months. The CSVs are
      # the part that can be checked: the run is seeded and every float is
      # written to six decimals, so a rerun that changes one has changed a
      # result. Only the CSVs, deliberately. A PNG is rasterised through the
      # host's own freetype, so two machines can draw the same figure into
      # different bytes and turn this red for a font difference.
      - name: The tournament reproduces the committed results
        run: |
          python mirror_neurons/run_tournament.py
          git diff --exit-code --stat -- 'mirror_neurons/results/*.csv'

      - name: The figures still draw from those CSVs
        run: python mirror_neurons/plot_results.py

      # Everything about the LLM harness that is logic rather than model: the
      # talk exchange really being simultaneous, the scoring, the answer format,
      # the bots behaving as themselves, and a killed run resuming without
      # repeating or losing a match. No Ollama, no GPU, nothing downloaded.
      - name: The LLM harness passes its offline checks
        run: python llm/preflight_checks.py

      # The raw log costs hours on a GPU and cannot be regenerated here, so what
      # gets checked is everything derived from it. Inert until the first run
      # lands a matches.jsonl, and guarding from the moment it does.
      - name: The LLM tables still derive from the committed log
        run: |
          python llm/run_analysis.py
          git diff --exit-code --stat -- 'llm/results/*.csv'

      # The join between the two halves is arithmetic over both sets of CSVs, so
      # it gets the same guarantee: it cannot quietly disagree with either side.
      - name: The two halves still join on their shared opponents
        run: |
          python comparison.py
          git diff --exit-code --stat -- comparison.csv

      # The rendered paper is the one artefact this workflow does not rebuild,
      # because that would mean installing Quarto and LaTeX to check a document.
      # Rendering stamps a digest of every table it read, so the cheap half of
      # the guarantee is available: a table that moved without the paper being
      # re-rendered fails here rather than being published.
      - name: The published paper was rendered from these tables
        run: python article/check_freshness.py

      # The article reads its figures from the CSVs, so it cannot drift. The
      # READMEs and the site type theirs by hand and can, and did: a sentence
      # quoting 0.630 sat beside a table that said 0.666 until someone noticed.
      # A stale sentence next to a fresh number is worse than two stale ones,
      # because the live figure lends the dead one its credibility.
      - name: Numbers quoted in prose still match their tables
        run: python check_quoted_numbers.py
