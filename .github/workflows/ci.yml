name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r equilibrium/requirements.txt

      # original/ is preserved, not maintained. Nothing there is expected to run,
      # and one of its notebooks does not terminate by design of its last cell.
      - name: The equilibrium recomputes, and its checks still pass
        run: jupyter execute equilibrium/equilibrium_recomputed.ipynb

      - name: The mirror-neuron simulation still runs end to end
        run: jupyter execute mirror_neurons/mirror_neurons_rerun.ipynb

      - name: The tournament chart still builds
        working-directory: tournament
        run: python plot_leaderboard.py
